<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lichess Stream Stats</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 100px 20px 20px;
    background: #0d1117;
    color: #fff;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
}

body {
    background: transparent;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   WIDGET
   ========================================================= */

.lichess-widget {

    width: 100%;
    max-width: 330px;

    margin: 0 auto;

    padding: 12px 13px 11px;

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            #171b22 0%,
            #11151b 100%
        );

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 8px 25px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);

}


/* =========================================================
   MODE SWITCHER
   ========================================================= */

.modes {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 4px;

    padding: 3px;

    margin-bottom: 11px;

    border-radius: 9px;

    background: #090c10;

    border: 1px solid rgba(255,255,255,.07);

}


.mode {

    height: 27px;

    padding: 0;

    border: 0;

    border-radius: 6px;

    background: transparent;

    color:
        rgba(255,255,255,.42);

    font-family: inherit;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .06em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease,
        box-shadow .18s ease;

}


.mode:hover {

    color:
        rgba(255,255,255,.8);

}


.mode.active {

    color: #ffffff;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.07)
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.08),
        0 2px 6px
        rgba(0,0,0,.25);

}


/* =========================================================
   SCORE
   ========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;

    margin-bottom: 9px;

}


.stat {

    height: 53px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    border-radius: 8px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.06);

}


.stat-value {

    font-size: 22px;

    line-height: 1;

    font-weight: 950;

    letter-spacing: -.04em;

}


.stat-label {

    margin-top: 5px;

    font-size: 7px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: .1em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,.38);

}


/* =========================================================
   COLORS
   ========================================================= */

.wins {

    border-color:
        rgba(55,220,130,.16);

}

.wins .stat-value {

    color: #48df8a;

    text-shadow:
        0 0 12px
        rgba(72,223,138,.18);

}


.draws {

    border-color:
        rgba(190,195,205,.11);

}

.draws .stat-value {

    color: #d3d6dc;

}


.losses {

    border-color:
        rgba(255,75,75,.15);

}

.losses .stat-value {

    color: #ff6262;

    text-shadow:
        0 0 12px
        rgba(255,98,98,.18);

}


/* =========================================================
   RESULT BAR
   ========================================================= */

.result-bar {

    position: relative;

    width: 100%;

    height: 12px;

    display: flex;

    overflow: hidden;

    border-radius: 999px;

    background:
        #080a0d;

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        inset 0 2px 4px
        rgba(0,0,0,.55);

}


/*
   Kolorowe segmenty.
*/

.result-win,
.result-draw,
.result-loss {

    height: 100%;

    transition:
        width .4s
        cubic-bezier(.22,1,.36,1);

}


.result-win {

    background:
        linear-gradient(
            90deg,
            #24bd6b,
            #51e495
        );

    box-shadow:
        0 0 10px
        rgba(70,225,140,.28);

}


.result-draw {

    background:
        linear-gradient(
            90deg,
            #707782,
            #a3a8b0
        );

}


.result-loss {

    background:
        linear-gradient(
            90deg,
            #ef4c4c,
            #ff6868
        );

    box-shadow:
        0 0 10px
        rgba(255,80,80,.25);

}


/* =========================================================
   BAR LABELS
   ========================================================= */

.bar-info {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    margin-top: 5px;

}


.bar-label {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;

    color:
        rgba(255,255,255,.35);

    font-size: 7px;

    font-weight: 900;

    letter-spacing: .05em;

}


.dot {

    width: 5px;

    height: 5px;

    border-radius: 50%;

}


.dot-win {

    background: #48df8a;

}


.dot-draw {

    background: #a3a8b0;

}


.dot-loss {

    background: #ff6262;

}


/* =========================================================
   LOADING
   ========================================================= */

.state {

    padding: 14px 5px;

    text-align: center;

    color:
        rgba(255,255,255,.4);

    font-size: 10px;

    font-weight: 700;

}


.loading-dot {

    display: inline-block;

    width: 6px;

    height: 6px;

    margin-right: 5px;

    border-radius: 50%;

    background: #58a6ff;

    animation:
        loadingPulse
        1.1s
        infinite
        ease-in-out;

}


@keyframes loadingPulse {

    0%,
    100% {

        opacity: .3;

        transform:
            scale(.75);

    }

    50% {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================================================
   ERROR
   ========================================================= */

.error {

    color:
        #ff6b6b;

}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden {

    display: none !important;

}


/* =========================================================
   SMALL STREAM SIZES
   ========================================================= */

@media (max-width: 300px) {

    .lichess-widget {

        max-width: 280px;

        padding:
            10px;

    }

    .mode {

        height: 25px;

        font-size: 9px;

    }

    .stat {

        height: 49px;

    }

    .stat-value {

        font-size: 20px;

    }

}

</style>
</head>


<body>


<div class="lichess-widget">


    <!-- =====================================================
         MODE SWITCHER
         ===================================================== -->

    <div class="modes">

        <button
            class="mode"
            data-mode="bullet">

            Bullet

        </button>


        <button
            class="mode active"
            data-mode="blitz">

            Blitz

        </button>


        <button
            class="mode"
            data-mode="rapid">

            Rapid

        </button>

    </div>



    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
        id="loading"
        class="state">

        <span
            class="loading-dot">
        </span>

        Ładowanie…

    </div>



    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
        id="error"
        class="state error hidden">

        Nie udało się pobrać danych.

    </div>



    <!-- =====================================================
         CONTENT
         ===================================================== -->

    <div
        id="content"
        class="hidden">


        <!-- =================================================
             RESULTS
             ================================================= -->

        <div class="stats">


            <!-- WINS -->

            <div class="stat wins">

                <div
                    class="stat-value"
                    id="wins">

                    0

                </div>

                <div class="stat-label">

                    Wins

                </div>

            </div>



            <!-- DRAWS -->

            <div class="stat draws">

                <div
                    class="stat-value"
                    id="draws">

                    0

                </div>

                <div class="stat-label">

                    Draws

                </div>

            </div>



            <!-- LOSSES -->

            <div class="stat losses">

                <div
                    class="stat-value"
                    id="losses">

                    0

                </div>

                <div class="stat-label">

                    Losses

                </div>

            </div>


        </div>



        <!-- =================================================
             PROGRESS BAR
             ================================================= -->

        <div class="result-bar">


            <div
                class="result-win"
                id="winBar">
            </div>


            <div
                class="result-draw"
                id="drawBar">
            </div>


            <div
                class="result-loss"
                id="lossBar">
            </div>


        </div>



        <!-- =================================================
             BAR LEGEND
             ================================================= -->

        <div class="bar-info">


            <div class="bar-label">

                <span
                    class="dot dot-win">
                </span>

                WINS

            </div>


            <div class="bar-label">

                <span
                    class="dot dot-draw">
                </span>

                DRAWS

            </div>


            <div class="bar-label">

                <span
                    class="dot dot-loss">
                </span>

                LOSSES

            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   KONFIGURACJA
   ========================================================= */


/*
    Nazwa użytkownika Lichess.
*/

const USERNAME =
    "Princec7";


/*
    Co ile milisekund
    sprawdzamy nowe partie.
*/

const REFRESH_INTERVAL =
    15000;


/*
    Po wykryciu nowej partii
    widget automatycznie przełącza
    się na jej tryb.
*/

const AUTO_SWITCH_DELAY =
    6000;



/* =========================================================
   TRYBY
   ========================================================= */

const MODES = [

    "bullet",
    "blitz",
    "rapid"

];



/* =========================================================
   STAN
   ========================================================= */

const state = {


    /*
        Wszystkie znane partie
        z dzisiejszego dnia.
    */

    games:
        new Map(),


    /*
        Statystyki dla każdego trybu.
    */

    stats: {

        bullet: {

            wins: 0,
            draws: 0,
            losses: 0

        },

        blitz: {

            wins: 0,
            draws: 0,
            losses: 0

        },

        rapid: {

            wins: 0,
            draws: 0,
            losses: 0

        }

    },


    /*
        Aktualnie pokazany tryb.
    */

    currentMode:
        "blitz",


    /*
        Timestamp ostatniej partii.
    */

    lastGameTime:
        0,


    /*
        Czy pierwszy request
        został już wykonany.
    */

    initialized:
        false,


    /*
        Blokada równoległych requestów.
    */

    loading:
        false

};



/* =========================================================
   DOM
   ========================================================= */

const $ =
    id =>
        document.getElementById(id);


const loadingEl =
    $("loading");


const errorEl =
    $("error");


const contentEl =
    $("content");


const winsEl =
    $("wins");


const drawsEl =
    $("draws");


const lossesEl =
    $("losses");


const winBar =
    $("winBar");


const drawBar =
    $("drawBar");


const lossBar =
    $("lossBar");


const modeButtons =
    document.querySelectorAll(
        ".mode"
    );



/* =========================================================
   CZAS
   ========================================================= */

function getTodayStart() {

    const date =
        new Date();

    date.setHours(
        0,
        0,
        0,
        0
    );

    return date.getTime();

}


function getNow() {

    return Date.now();

}



/* =========================================================
   NORMALIZACJA TRYBU
   ========================================================= */

function normalizeSpeed(
    speed
) {

    if (
        speed === "bullet"
    ) {

        return "bullet";

    }


    if (
        speed === "blitz"
    ) {

        return "blitz";

    }


    if (
        speed === "rapid"
    ) {

        return "rapid";

    }


    return null;

}



/* =========================================================
   WYNIK PARTII
   ========================================================= */

function getResult(
    game
) {

    const username =
        USERNAME.toLowerCase();


    const whiteName =
        game.players
            ?.white
            ?.user
            ?.name
            ?.toLowerCase();


    const blackName =
        game.players
            ?.black
            ?.user
            ?.name
            ?.toLowerCase();


    let playerColor =
        null;


    if (
        whiteName === username
    ) {

        playerColor =
            "white";

    }


    if (
        blackName === username
    ) {

        playerColor =
            "black";

    }


    /*
        Nie znaleziono użytkownika.
    */

    if (!playerColor) {

        return "draw";

    }


    const winner =
        game.winner;


    /*
        Brak zwycięzcy oznacza remis.
    */

    if (!winner) {

        return "draw";

    }


    if (
        winner === playerColor
    ) {

        return "win";

    }


    return "loss";

}



/* =========================================================
   DODAWANIE PARTII
   ========================================================= */

function addGame(
    game
) {


    /*
        Bez ID nie możemy
        bezpiecznie wykrywać duplikatów.
    */

    if (
        !game ||
        !game.id
    ) {

        return false;

    }


    /*
        Partia już jest znana.
    */

    if (
        state.games.has(
            game.id
        )
    ) {

        return false;

    }


    /*
        Pobieramy wyłącznie
        Bullet / Blitz / Rapid.
    */

    const mode =
        normalizeSpeed(
            game.speed
        );


    if (!mode) {

        return false;

    }


    /*
        Zapamiętujemy partię.
    */

    state.games.set(
        game.id,
        {
            ...game,
            _mode: mode
        }
    );


    /*
        Aktualizujemy timestamp.
    */

    const createdAt =
        Number(
            game.createdAt || 0
        );


    if (
        createdAt >
        state.lastGameTime
    ) {

        state.lastGameTime =
            createdAt;

    }


    /*
        Ustalamy wynik.
    */

    const result =
        getResult(game);


    if (
        result === "win"
    ) {

        state.stats[
            mode
        ].wins++;

    }


    if (
        result === "draw"
    ) {

        state.stats[
            mode
        ].draws++;

    }


    if (
        result === "loss"
    ) {

        state.stats[
            mode
        ].losses++;

    }


    return true;

}



/* =========================================================
   POBIERANIE NDJSON
   ========================================================= */

async function fetchGames(
    url
) {


    const response =
        await fetch(
            url,
            {
                method:
                    "GET",

                headers: {

                    "Accept":
                        "application/x-ndjson"

                },

                cache:
                    "no-store"

            }
        );


    /*
        Błąd HTTP.
    */

    if (
        !response.ok
    ) {


        /*
            Rate limit Lichess.
        */

        if (
            response.status ===
            429
        ) {

            throw new Error(
                "Lichess API rate limit"
            );

        }


        throw new Error(
            `Lichess API HTTP ${response.status}`
        );

    }


    const text =
        await response.text();


    if (
        !text.trim()
    ) {

        return [];

    }


    /*
        NDJSON =
        jedna partia na linię.
    */

    const lines =
        text
            .split("\n")
            .map(
                line =>
                    line.trim()
            )
            .filter(Boolean);


    const games = [];


    for (
        const line of lines
    ) {

        try {

            const game =
                JSON.parse(line);

            games.push(
                game
            );

        } catch (
            error
        ) {

            console.warn(
                "Nie udało się odczytać partii:",
                line
            );

        }

    }


    return games;

}



/* =========================================================
   PIERWSZE POBRANIE
   ========================================================= */

async function initialLoad() {


    /*
        Nie uruchamiamy
        równoległego requestu.
    */

    if (
        state.loading
    ) {

        return;

    }


    state.loading =
        true;


    loadingEl
        .classList
        .remove(
            "hidden"
        );


    errorEl
        .classList
        .add(
            "hidden"
        );


    contentEl
        .classList
        .add(
            "hidden"
        );


    try {


        const since =
            getTodayStart();


        const until =
            getNow();


        /*
            Pobieramy dzisiejsze partie.
        */

        const url =
            "https://lichess.org/api/games/user/" +
            encodeURIComponent(
                USERNAME
            ) +
            "?since=" +
            since +
            "&until=" +
            until +
            "&max=100" +
            "&pgnInJson=true";


        const games =
            await fetchGames(
                url
            );


        let newestMode =
            null;


        let newestTime =
            0;


        /*
            Dodajemy wszystkie
            dzisiejsze partie.
        */

        for (
            const game of games
        ) {


            const added =
                addGame(
                    game
                );


            if (!added) {

                continue;

            }


            const gameTime =
                Number(
                    game.createdAt ||
                    0
                );


            /*
                Zapamiętujemy
                najnowszą partię.
            */

            if (
                gameTime >=
                newestTime
            ) {

                newestTime =
                    gameTime;


                newestMode =
                    normalizeSpeed(
                        game.speed
                    );

            }

        }


        /*
            Jeśli istnieje dzisiejsza
            partia, pokazujemy jej tryb.
        */

        if (
            newestMode
        ) {

            state.currentMode =
                newestMode;

        }


        state.initialized =
            true;


        render();


    } catch (
        error
    ) {


        console.error(
            error
        );


        showError();

    } finally {


        state.loading =
            false;


        loadingEl
            .classList
            .add(
                "hidden"
            );

    }

}



/* =========================================================
   AKTUALIZACJA
   ========================================================= */

async function updateGames() {


    /*
        Jeśli poprzedni request
        nadal trwa — pomijamy.
    */

    if (
        state.loading
    ) {

        return;

    }


    /*
        Jeśli aplikacja
        nie została jeszcze
        zainicjalizowana.
    */

    if (
        !state.initialized
    ) {

        await initialLoad();

        return;

    }


    state.loading =
        true;


    try {


        /*
            Pobieramy wyłącznie
            nowe partie.
        */

        const since =
            Math.max(
                getTodayStart(),
                state.lastGameTime + 1
            );


        const until =
            getNow();


        const effectiveSince =
            state.lastGameTime > 0
                ? since
                : getTodayStart();


        const url =
            "https://lichess.org/api/games/user/" +
            encodeURIComponent(
                USERNAME
            ) +
            "?since=" +
            effectiveSince +
            "&until=" +
            until +
            "&max=100" +
            "&pgnInJson=true";


        const games =
            await fetchGames(
                url
            );


        let newestGame =
            null;


        let newestTime =
            0;


        /*
            Sprawdzamy nowe partie.
        */

        for (
            const game of games
        ) {


            const mode =
                normalizeSpeed(
                    game.speed
                );


            /*
                Pomijamy inne
                typy partii.
            */

            if (!mode) {

                continue;

            }


            const added =
                addGame(
                    game
                );


            if (!added) {

                continue;

            }


            const gameTime =
                Number(
                    game.createdAt ||
                    0
                );


            /*
                Szukamy najnowszej.
            */

            if (
                gameTime >=
                newestTime
            ) {

                newestTime =
                    gameTime;


                newestGame =
                    game;

            }

        }


        /*
            Jeśli pojawiła się
            nowa partia —
            przełączamy tryb.
        */

        if (
            newestGame
        ) {


            const newestMode =
                normalizeSpeed(
                    newestGame.speed
                );


            if (
                newestMode
            ) {


                state.currentMode =
                    newestMode;


                updateModeButtons();


                render();


                /*
                    Po 6 sekundach
                    ponownie renderujemy
                    aktualny stan.
                */

                setTimeout(
                    () => {

                        render();

                    },
                    AUTO_SWITCH_DELAY
                );

            }


        } else {


            /*
                Nic nowego —
                tylko odświeżamy widok.
            */

            render();

        }


    } catch (
        error
    ) {


        /*
            Przy chwilowym błędzie
            pozostawiamy poprzednie
            poprawne dane.
        */

        console.error(
            "Aktualizacja Lichess:",
            error
        );


    } finally {


        state.loading =
            false;

    }

}



/* =========================================================
   RENDER
   ========================================================= */

function render() {


    const stats =
        state.stats[
            state.currentMode
        ];


    const wins =
        stats.wins;


    const draws =
        stats.draws;


    const losses =
        stats.losses;


    const total =
        wins +
        draws +
        losses;


    /*
        Liczby.
    */

    winsEl.textContent =
        wins;


    drawsEl.textContent =
        draws;


    lossesEl.textContent =
        losses;


    /*
        Pasek wyników.
    */

    if (
        total > 0
    ) {


        const winPercent =
            (wins / total) * 100;


        const drawPercent =
            (draws / total) * 100;


        const lossPercent =
            (losses / total) * 100;


        winBar.style.width =
            `${winPercent}%`;


        drawBar.style.width =
            `${drawPercent}%`;


        lossBar.style.width =
            `${lossPercent}%`;


    } else {


        winBar.style.width =
            "0%";


        drawBar.style.width =
            "0%";


        lossBar.style.width =
            "0%";

    }


    /*
        Pokazujemy widget.
    */

    contentEl
        .classList
        .remove(
            "hidden"
        );


    loadingEl
        .classList
        .add(
            "hidden"
        );


    errorEl
        .classList
        .add(
            "hidden"
        );


    updateModeButtons();

}



/* =========================================================
   MODE BUTTONS
   ========================================================= */

function updateModeButtons() {


    modeButtons.forEach(
        button => {


            const mode =
                button.dataset.mode;


            button.classList.toggle(
                "active",
                mode ===
                    state.currentMode
            );

        }
    );

}



/*
    Ręczna zmiana trybu.
*/

modeButtons.forEach(
    button => {


        button.addEventListener(
            "click",
            () => {


                const mode =
                    button.dataset.mode;


                if (
                    !MODES.includes(
                        mode
                    )
                ) {

                    return;

                }


                state.currentMode =
                    mode;


                render();

            }
        );

    }
);



/* =========================================================
   ERROR
   ========================================================= */

function showError() {


    loadingEl
        .classList
        .add(
            "hidden"
        );


    contentEl
        .classList
        .add(
            "hidden"
        );


    errorEl
        .classList
        .remove(
            "hidden"
        );

}



/* =========================================================
   START
   ========================================================= */

initialLoad();



/*
    Automatyczne odświeżanie
    co 15 sekund.
*/

setInterval(
    () => {

        updateGames();

    },
    REFRESH_INTERVAL
);


</script>

</body>
</html>
