<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lichess Stream Stats</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 100px 20px 20px;
    background: #0d1117;
    color: #fff;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
}

body {
    background: transparent;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   WIDGET
   ========================================================= */

.lichess-widget {

    width: 100%;
    max-width: 330px;

    margin: 0 auto;

    padding: 12px 13px 11px;

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            #171b22 0%,
            #11151b 100%
        );

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 8px 25px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);

}


/* =========================================================
   MODE SWITCHER
   ========================================================= */

.modes {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 4px;

    padding: 3px;

    margin-bottom: 11px;

    border-radius: 9px;

    background: #090c10;

    border: 1px solid rgba(255,255,255,.07);

}


.mode {

    height: 27px;

    padding: 0;

    border: 0;

    border-radius: 6px;

    background: transparent;

    color:
        rgba(255,255,255,.42);

    font-family: inherit;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .06em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease,
        box-shadow .18s ease;

}


.mode:hover {

    color:
        rgba(255,255,255,.8);

}


.mode.active {

    color: #ffffff;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.07)
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.08),
        0 2px 6px
        rgba(0,0,0,.25);

}


/* =========================================================
   SCORE
   ========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;

    margin-bottom: 9px;

}


.stat {

    height: 53px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    border-radius: 8px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.06);

}


.stat-value {

    font-size: 22px;

    line-height: 1;

    font-weight: 950;

    letter-spacing: -.04em;

}


.stat-label {

    margin-top: 5px;

    font-size: 7px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: .1em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,.38);

}


/* =========================================================
   COLORS
   ========================================================= */

.wins {

    border-color:
        rgba(55,220,130,.16);

}

.wins .stat-value {

    color: #48df8a;

    text-shadow:
        0 0 12px
        rgba(72,223,138,.18);

}


.draws {

    border-color:
        rgba(190,195,205,.11);

}

.draws .stat-value {

    color: #d3d6dc;

}


.losses {

    border-color:
        rgba(255,75,75,.15);

}

.losses .stat-value {

    color: #ff6262;

    text-shadow:
        0 0 12px
        rgba(255,98,98,.18);

}


/* =========================================================
   RESULT BAR
   ========================================================= */

.result-bar {

    position: relative;

    width: 100%;

    height: 12px;

    display: flex;

    overflow: hidden;

    border-radius: 999px;

    background:
        #080a0d;

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        inset 0 2px 4px
        rgba(0,0,0,.55);

}


/*
   Kolorowe segmenty.
*/

.result-win,
.result-draw,
.result-loss {

    height: 100%;

    transition:
        width .4s
        cubic-bezier(.22,1,.36,1);

}


.result-win {

    background:
        linear-gradient(
            90deg,
            #24bd6b,
            #51e495
        );

    box-shadow:
        0 0 10px
        rgba(70,225,140,.28);

}


.result-draw {

    background:
        linear-gradient(
            90deg,
            #707782,
            #a3a8b0
        );

}


.result-loss {

    background:
        linear-gradient(
            90deg,
            #ef4c4c,
            #ff6868
        );

    box-shadow:
        0 0 10px
        rgba(255,80,80,.25);

}


/* =========================================================
   BAR LABELS
   ========================================================= */

.bar-info {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    margin-top: 5px;

}


.bar-label {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;

    color:
        rgba(255,255,255,.35);

    font-size: 7px;

    font-weight: 900;

    letter-spacing: .05em;

}


.dot {

    width: 5px;

    height: 5px;

    border-radius: 50%;

}


.dot-win {

    background: #48df8a;

}


.dot-draw {

    background: #a3a8b0;

}


.dot-loss {

    background: #ff6262;

}


/* =========================================================
   LOADING
   ========================================================= */

.state {

    padding: 14px 5px;

    text-align: center;

    color:
        rgba(255,255,255,.4);

    font-size: 10px;

    font-weight: 700;

}


.loading-dot {

    display: inline-block;

    width: 6px;

    height: 6px;

    margin-right: 5px;

    border-radius: 50%;

    background: #58a6ff;

    animation:
        loadingPulse
        1.1s
        infinite
        ease-in-out;

}


@keyframes loadingPulse {

    0%,
    100% {

        opacity: .3;

        transform:
            scale(.75);

    }

    50% {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================================================
   ERROR
   ========================================================= */

.error {

    color:
        #ff6b6b;

}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden {

    display: none !important;

}


/* =========================================================
   SMALL STREAM SIZES
   ========================================================= */

@media (max-width: 300px) {

    .lichess-widget {

        max-width: 280px;

        padding:
            10px;

    }

    .mode {

        height: 25px;

        font-size: 9px;

    }

    .stat {

        height: 49px;

    }

    .stat-value {

        font-size: 20px;

    }

}

</style>
</head>


<body>


<div class="lichess-widget">


    <!-- =====================================================
         MODE SWITCHER
         ===================================================== -->

    <div class="modes">

        <button
            class="mode"
            data-mode="bullet">

            Bullet

        </button>


        <button
            class="mode active"
            data-mode="blitz">

            Blitz

        </button>


        <button
            class="mode"
            data-mode="rapid">

            Rapid

        </button>

    </div>



    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
        id="loading"
        class="state">

        <span
            class="loading-dot">
        </span>

        Ładowanie…

    </div>



    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
        id="error"
        class="state error hidden">

        Nie udało się pobrać danych.

    </div>



    <!-- =====================================================
         CONTENT
         ===================================================== -->

    <div
        id="content"
        class="hidden">


        <!-- =================================================
             RESULTS
             ================================================= -->

        <div class="stats">


            <!-- WINS -->

            <div class="stat wins">

                <div
                    class="stat-value"
                    id="wins">

                    0

                </div>

                <div class="stat-label">

                    Wins

                </div>

            </div>



            <!-- DRAWS -->

            <div class="stat draws">

                <div
                    class="stat-value"
                    id="draws">

                    0

                </div>

                <div class="stat-label">

                    Draws

                </div>

            </div>



            <!-- LOSSES -->

            <div class="stat losses">

                <div
                    class="stat-value"
                    id="losses">

                    0

                </div>

                <div class="stat-label">

                    Losses

                </div>

            </div>


        </div>



        <!-- =================================================
             PROGRESS BAR
             ================================================= -->

        <div class="result-bar">


            <div
                class="result-win"
                id="winBar">
            </div>


            <div
                class="result-draw"
                id="drawBar">
            </div>


            <div
                class="result-loss"
                id="lossBar">
            </div>


        </div>



        <!-- =================================================
             BAR LEGEND
             ================================================= -->

        <div class="bar-info">


            <div class="bar-label">

                <span
                    class="dot dot-win">
                </span>

                WINS

            </div>


            <div class="bar-label">

                <span
                    class="dot dot-draw">
                </span>

                DRAWS

            </div>


            <div class="bar-label">

                <span
                    class="dot dot-loss">
                </span>

                LOSSES

            </div>


        </div>


    </div>


</div>



<script>
/*
  Chess.com Daily Stats Widget
  Public Chess.com Published Data API.
  Change USERNAME to the Chess.com username.
*/
const USERNAME = "NFKrolPawelTv";
const REFRESH_INTERVAL = 60000; // 60 seconds (avoid excessive API requests)

const MODES = ["bullet", "blitz", "rapid"];
const state = {
  games: new Map(),
  stats: {
    bullet: { wins: 0, draws: 0, losses: 0 },
    blitz: { wins: 0, draws: 0, losses: 0 },
    rapid: { wins: 0, draws: 0, losses: 0 }
  },
  currentMode: "blitz",
  loading: false
};

const $ = id => document.getElementById(id);
const loadingEl = $("loading");
const errorEl = $("error");
const contentEl = $("content");
const winsEl = $("wins");
const drawsEl = $("draws");
const lossesEl = $("losses");
const winBar = $("winBar");
const drawBar = $("drawBar");
const lossBar = $("lossBar");
const modeButtons = document.querySelectorAll(".mode");

function getTodayStartSeconds() {
  const date = new Date();
  date.setHours(0, 0, 0, 0);
  return Math.floor(date.getTime() / 1000);
}

function normalizeMode(timeClass) {
  return MODES.includes(timeClass) ? timeClass : null;
}

function resultForPlayer(game, username) {
  const user = username.toLowerCase();
  const white = (game.white?.username || "").toLowerCase();
  const black = (game.black?.username || "").toLowerCase();

  let player, opponent;
  if (white === user) {
    player = game.white;
    opponent = game.black;
  } else if (black === user) {
    player = game.black;
    opponent = game.white;
  } else {
    return null;
  }

  const result = (player?.result || "").toLowerCase();
  if (result === "win") return "win";

  const drawResults = new Set([
    "agreed", "repetition", "stalemate", "insufficient",
    "50move", "timevsinsufficient", "draw"
  ]);
  if (drawResults.has(result)) return "draw";

  // Chess.com records losses as values such as resigned, checkmated,
  // timeout, abandoned or lose. If the opponent won, this is also a loss.
  if (result) return "loss";
  if ((opponent?.result || "").toLowerCase() === "win") return "loss";
  return null;
}

function resetStats() {
  for (const mode of MODES) {
    state.stats[mode] = { wins: 0, draws: 0, losses: 0 };
  }
  state.games.clear();
}

async function fetchJson(url) {
  const response = await fetch(url, {
    headers: { "Accept": "application/json" },
    cache: "no-store"
  });
  if (!response.ok) {
    throw new Error(`Chess.com API HTTP ${response.status}`);
  }
  return response.json();
}

async function loadTodayGames() {
  if (state.loading) return;
  state.loading = true;
  loadingEl.classList.remove("hidden");
  errorEl.classList.add("hidden");

  try {
    const username = encodeURIComponent(USERNAME.trim());
    const archivesData = await fetchJson(
      `https://api.chess.com/pub/player/${username}/games/archives`
    );
    const archives = archivesData.archives || [];

    // Chess.com archives are monthly. Fetch the current month archive
    // and then keep only games that ended today in the visitor's local time.
    const now = new Date();
    const currentArchive = archives.find(url => {
      const match = url.match(/\/games\/(\d{4})\/(\d{2})$/);
      return match &&
        Number(match[1]) === now.getFullYear() &&
        Number(match[2]) === now.getMonth() + 1;
    });

    resetStats();

    if (currentArchive) {
      const archiveData = await fetchJson(currentArchive);
      const todayStart = getTodayStartSeconds();
      const nowSeconds = Math.floor(Date.now() / 1000);

      for (const game of (archiveData.games || [])) {
        const endTime = Number(game.end_time || 0);
        if (endTime < todayStart || endTime > nowSeconds) continue;

        const mode = normalizeMode(game.time_class);
        if (!mode) continue;

        const result = resultForPlayer(game, USERNAME);
        if (!result) continue;

        const id = game.url || `${endTime}-${game.white?.username}-${game.black?.username}`;
        if (state.games.has(id)) continue;
        state.games.set(id, game);
        state.stats[mode][result === "win" ? "wins" : result === "draw" ? "draws" : "losses"]++;
      }

      // Select the mode of the most recent eligible game on initial/refresh load.
      const todays = [...state.games.values()].sort(
        (a, b) => Number(b.end_time || 0) - Number(a.end_time || 0)
      );
      if (todays.length) {
        state.currentMode = normalizeMode(todays[0].time_class) || state.currentMode;
      }
    }

    updateModeButtons();
    render();
  } catch (error) {
    console.error("Chess.com stats:", error);
    if (!state.games.size) {
      errorEl.textContent =
        "Nie udało się pobrać danych z Chess.com. Sprawdź nazwę gracza i połączenie.";
      errorEl.classList.remove("hidden");
      contentEl.classList.add("hidden");
    }
  } finally {
    state.loading = false;
    loadingEl.classList.add("hidden");
  }
}

function updateModeButtons() {
  modeButtons.forEach(button => {
    button.classList.toggle("active", button.dataset.mode === state.currentMode);
  });
}

function render() {
  const stats = state.stats[state.currentMode];
  const { wins, draws, losses } = stats;
  const total = wins + draws + losses;

  winsEl.textContent = wins;
  drawsEl.textContent = draws;
  lossesEl.textContent = losses;

  winBar.style.width = total ? `${wins / total * 100}%` : "0%";
  drawBar.style.width = total ? `${draws / total * 100}%` : "0%";
  lossBar.style.width = total ? `${losses / total * 100}%` : "0%";

  contentEl.classList.remove("hidden");
  loadingEl.classList.add("hidden");
}

modeButtons.forEach(button => {
  button.addEventListener("click", () => {
    state.currentMode = button.dataset.mode;
    updateModeButtons();
    render();
  });
});

loadTodayGames();
setInterval(loadTodayGames, REFRESH_INTERVAL);
</script>
</body>
</html>
