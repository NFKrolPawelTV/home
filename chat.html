<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0e0e10;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat {
      width: 350px;
      height: 600px;
      border: 2px solid #9147ff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(145, 71, 255, 0.3);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="chat">
    <iframe
      src="https://www.twitch.tv/embed/piotrkazikpawekaczorowski/chat?parent=nfkrolpaweltv.github.io"
      width="350"
      height="600"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
